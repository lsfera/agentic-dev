services:
  devcontainer:
    # Per-project container name (#41), derived from the workspace folder by
    # .devcontainer/init.sh (DEVCONTAINER_NAME in .env) so two projects can run
    # at once without colliding. The docker MCP server targets it via
    # ALLOWED_CONTAINERS=devcontainer:<DEVCONTAINER_NAME>. Fallback keeps a bare
    # `docker compose up` working if .env hasn't been generated yet.
    #
    # init.sh is OPTIONAL: every var below carries a fallback, so this file boots
    # standalone with a bare `docker compose up` from a project dir — no .env, no
    # init.sh. ${PWD} is the dir Compose runs from (keeps the ADR-0011 path match);
    # ${HOME} is the host home. When init.sh / VS Code set these vars, they win.
    container_name: ${DEVCONTAINER_NAME:-devcontainer}
    # Dogfooding from the published image (ADR-0015/0016): the dogfood runs from the
    # prebuilt outer image, not a local build. The workspace still carries
    # .sandcastle/*.ts, so the orchestrator runs from the workspace source — the
    # baked /opt copy is only the adopter fallback. `:latest` tracks the newest
    # publish; pin a release for reproducibility (resolve with
    # `curl -s https://api.github.com/repos/lsfera/agentic-dev/releases | jq -r '.[0].tag_name | ltrimstr("v")'`).
    image: ghcr.io/lsfera/agentic-dev/devcontainer:latest
    # Fallback — build locally instead of pulling:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    volumes:
      # Workspace — Compose does not auto-mount the project; declared explicitly.
      # Both vars are written to .env by init.sh; WORKSPACE_FOLDER must match
      # "workspaceFolder" in devcontainer.json.
      # consistency: cached = host is authoritative, container reads may briefly lag.
      # (No-op on modern Docker Desktop/VirtioFS, but correct intent + helps on osxfs.)
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-${PWD}}
        target: ${WORKSPACE_FOLDER:-/workspace}
        consistency: cached

      # Path-matched mirror of the SAME project dir at its real host path (ADR-0011).
      # The sandcastle orchestrator runs from here so the git worktrees it creates
      # (<project>/.sandcastle/worktrees/...) carry host-resolvable paths — otherwise
      # docker-outside-of-docker rejects the inner-sandbox bind mount ("mounts denied",
      # path not known to the host daemon). Humans/editor keep using ${WORKSPACE_FOLDER};
      # only the orchestrator cds here. Harmless extra mount for non-sandcastle projects.
      - type: bind
        source: ${LOCAL_WORKSPACE_FOLDER:-${PWD}}
        target: ${LOCAL_WORKSPACE_FOLDER:-${PWD}}
        consistency: cached

      # SSH keys — read-only for private git access.
      # System-wide known_hosts are baked into the MS base image.
      - type: bind
        source: ${SSH_DIR:-${HOME}/.ssh}
        target: /home/vscode/.ssh
        read_only: true
        bind:
          create_host_path: true

      # Claude Code config, MCP registrations, memory — shared across rebuilds.
      - type: bind
        source: ${CLAUDE_PERSIST_HOST_DIR:-${HOME}/.devcontainer-claude}
        target: /home/vscode/.claude-persist
        bind:
          create_host_path: true

      # Host Docker socket. The docker-outside-of-docker feature (devcontainer.json)
      # installs the CLI and fixes the socket group for the vscode user at startup,
      # so no group_add / DOCKER_GID is needed here.
      - type: bind
        source: ${DOCKER_SOCK:-/var/run/docker.sock}
        target: /var/run/docker.sock

    # Cockpit-mode credential passthrough (ADR-0018): forward GitHub and Claude
    # credentials from the host shell into the container so a human can run the
    # full workflow from inside (`docker compose exec -it devcontainer cockpit`).
    # Values are taken from the host environment — nothing is committed here.
    # GH_TOKEN and GITHUB_TOKEN are merged into one nested-fallback line rather
    # than forwarded as two separate vars: `gh` only falls back GH_TOKEN ->
    # GITHUB_TOKEN when GH_TOKEN is absent, NOT when it's present-but-empty —
    # forwarding both unconditionally (${GH_TOKEN:-}) would always set an empty
    # GH_TOKEN and break auth for anyone who only exports GITHUB_TOKEN on the
    # host. AGENTIC_IN_CONTAINER is baked into the image via the Dockerfile ENV
    # directive, not forwarded here.
    environment:
      GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Context compression (headroom-ai, .sandcastle/context-compressor.ts) — off
      # by default (HEADROOM_MODE=off). HEADROOM_BASE_URL defaults to the sibling
      # `headroom` service below (opt-in via `--profile headroom`, since most runs
      # never touch this); override to point at Headroom Cloud instead. Without
      # HEADROOM_MODE set to conservative/aggressive none of this is consulted.
      HEADROOM_MODE: ${HEADROOM_MODE:-}
      HEADROOM_MODEL: ${HEADROOM_MODEL:-}
      HEADROOM_BASE_URL: ${HEADROOM_BASE_URL:-http://headroom:8787}
      HEADROOM_API_KEY: ${HEADROOM_API_KEY:-}

    working_dir: ${WORKSPACE_FOLDER:-/workspace}
    # Fix docker-host.sock's group before idling. docker-outside-of-docker's own
    # /usr/local/share/docker-init.sh normally does this, but only as a CLI-
    # injected ENTRYPOINT wrapper (devcontainer up / VS Code Reopen in
    # Container) — this project deliberately supports launching via a bare
    # `docker compose up` too (README "Local development & dogfood"), which
    # never invokes that wrapper, so the fixup silently never runs and every
    # docker-outside-of-docker call inside the container gets "permission
    # denied". Even invoking docker-init.sh wouldn't fully help here: on Docker
    # Desktop, docker-host.sock's GID is 0 (root), and docker-init.sh's own
    # logic can't groupmod the "docker" group onto an already-taken GID 0 — it
    # falls back to a socat proxy on docker.sock instead, which is exactly the
    # proxy main.ts's resolveDockerHost() bypasses (the empty-turn-#2 fix) by
    # talking to docker-host.sock directly. That bypass only works if
    # docker-host.sock itself is reachable, which is what this actually fixes.
    # Best-effort: harmless no-op if the socket is absent (bare `docker compose
    # up`, no DooD feature) or already correctly grouped. sudo is passwordless
    # for vscode in the base devcontainer image.
    command: >
      sh -c "sudo chgrp docker /var/run/docker-host.sock 2>/dev/null; exec sleep infinity"

  # Headroom compression proxy (opt-in: `docker compose --profile headroom up`).
  # context-compressor.ts calls compress(), which defaults to POSTing to
  # http://localhost:8787/v1/compress (headroom-ai's own DEFAULT_BASE_URL) — this
  # service provides that locally instead of requiring Headroom Cloud. Profiled
  # rather than always-on because HEADROOM_MODE defaults to "off": most runs never
  # touch it, and pulling+running an idle container for everyone isn't worth it.
  # Image per https://headroomlabs-ai.github.io/headroom/docker-install/.
  # Needs its own LLM credential to actually perform compression (it calls the
  # model, e.g. claude-sonnet-4-6, itself) — CLAUDE_CODE_OAUTH_TOKEN (subscription,
  # ADR-0003) does NOT work here, only an API key. A user relying purely on the
  # subscription token has no key to give it; compression will fail to configure
  # and headroom-ai's client-side fallback (compressed: false) keeps prompts
  # uncompressed rather than blocking the run.
  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    profiles: ["headroom"]
    # The image's ENTRYPOINT is already ["headroom", "proxy"] (`docker inspect`
    # confirms this) — `command:` supplies only CLI options, never the
    # subcommand itself. Repeating "headroom proxy" here doubles the argv into
    # `headroom proxy headroom proxy --host ...`, which click rejects outright
    # ("Got unexpected extra arguments"), so the container exits immediately
    # and `--profile headroom up` never actually serves anything.
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Published to the host loopback (not just devcontainer-network) so both
    # a human on the host (`curl localhost:8787/stats`) and the INNER
    # sandbox — a docker-outside-of-docker sibling container on the separate
    # agentic-sandbox-net, not this compose project's network — can reach it,
    # the latter via host.docker.internal:8787, to route Claude Code's live
    # API traffic through the proxy (.sandcastle/sandbox-runner.ts). The
    # outer devcontainer service still resolves `headroom` directly by
    # compose DNS for its own one-shot compress() calls.
    ports:
      - "8787:8787"

networks:
  # Rename Compose's default network from "<project>_default" to a fixed,
  # human-named "devcontainer-network". The sole service auto-attaches to the
  # default network, so the sandbox lands on devcontainer-network — and other
  # containers (testcontainers Postgres, pgAdmin, …) can join it by name.
  default:
    name: devcontainer-network
